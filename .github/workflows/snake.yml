name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0点自动跑一次
  workflow_dispatch: {}   # 也支持手动点击触发
  push:
    branches:
      - main              # 每次 push 到 main 分支也会自动跑一次

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake game from a github user (yourself) contributions
        uses: Platane/snk@v3
        with:
          github_user_name: yoruniubi
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}